<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIDE · Agent 驱动的 Java Web IDE</title>
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 在首屏渲染前恢复主题与缩放，避免闪白 / 闪动
      try {
        if (localStorage.getItem('aide.theme') === 'light') document.documentElement.classList.add('theme-light')
        var z = localStorage.getItem('aide.zoom')
        if (z === 'compact') document.documentElement.style.zoom = '0.92'
        if (z === 'comfort') document.documentElement.style.zoom = '1.06'
      } catch (e) {}
    </script>
  </head>
  <body class="bg-base">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
