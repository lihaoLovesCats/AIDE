<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIDE 预览 · order-center</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f2f5f9;
        --panel: #ffffff;
        --line: #e2e8f0;
        --ink: #1a2330;
        --dim: #5c6875;
        --faint: #8b96a3;
        --accent: #2563eb;
        --ok: #15803d;
        --warn: #b45309;
        --err: #dc2626;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        font-size: 14px;
      }
      .shell { max-width: 1180px; margin: 0 auto; padding: 22px 24px 40px; }
      .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
      .logo {
        width: 34px; height: 34px; border-radius: 9px;
        background: linear-gradient(135deg, #5b8cff, #a78bfa);
        display: grid; place-items: center; color: #fff; font-weight: 700;
      }
      .title { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
      .sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
      .chips { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .chip {
        font: 11px/1.6 ui-monospace, Consolas, monospace;
        border: 1px solid var(--line); background: #fff; color: var(--dim);
        border-radius: 999px; padding: 2px 9px;
      }
      .chip.live { border-color: rgba(21,128,61,.3); background: rgba(21,128,61,.08); color: var(--ok); }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 2px rgba(15,23,42,.04); }
      .toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
      .field { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; font-size: 12px; color: var(--dim); background: #fbfcfe; }
      .field b { color: var(--ink); font-weight: 500; }
      .btn { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 5px 11px; font-size: 12px; color: var(--dim); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .grow { flex: 1; }
      table { width: 100%; border-collapse: collapse; }
      th {
        text-align: left; font-size: 11px; font-weight: 600; color: var(--faint);
        letter-spacing: .04em; text-transform: uppercase;
        padding: 9px 14px; background: #f8fafc; border-bottom: 1px solid var(--line);
      }
      td { padding: 10px 14px; border-bottom: 1px solid #eef2f7; font-size: 12.5px; color: var(--dim); }
      td.mono { font-family: ui-monospace, Consolas, monospace; color: var(--ink); }
      td.amount { font-family: ui-monospace, Consolas, monospace; color: var(--ink); text-align: right; }
      .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid; }
      .tag.paid { color: var(--ok); border-color: rgba(21,128,61,.25); background: rgba(21,128,61,.07); }
      .tag.pending { color: var(--warn); border-color: rgba(180,83,9,.25); background: rgba(180,83,9,.07); }
      .tag.refund { color: var(--err); border-color: rgba(220,38,38,.25); background: rgba(220,38,38,.07); }
      .pager { display: flex; align-items: center; gap: 6px; padding: 12px 14px; }
      .pager .grow { font-size: 11.5px; color: var(--faint); }
      .page {
        min-width: 26px; height: 26px; padding: 0 7px; border: 1px solid var(--line);
        background: #fff; border-radius: 6px; font-size: 12px; color: var(--dim);
      }
      .page.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      .note { margin-top: 14px; font-size: 11px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.15); }
      .banner {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 14px; padding: 8px 12px; border-radius: 9px;
        background: rgba(37,99,235,.06); border: 1px solid rgba(37,99,235,.18);
        color: #1d4ed8; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="banner">
        <span class="dot"></span>
        <span><b>AIDE 运行预览</b> · 该页面由 AIDE 从 Agent 的 worktree 启动，用于验证分页改动</span>
        <span class="grow"></span>
        <span id="meta" class="chip"></span>
      </div>

      <div class="top">
        <div class="logo">O</div>
        <div>
          <div class="title">订单中心</div>
          <div class="sub">order-center · 订单查询与退款</div>
        </div>
        <div class="chips">
          <span class="chip" id="branchChip">aide/order-api</span>
          <span class="chip">Spring Boot 3.2</span>
          <span class="chip live" id="portChip">:18080</span>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="field">状态 <b>全部</b></div>
          <div class="field">下单时间 <b>最近 7 天</b></div>
          <div class="field">关键字 <b>订单号 / 用户</b></div>
          <button class="btn">重置</button>
          <div class="grow"></div>
          <button class="btn">导出</button>
          <button class="btn primary">查询</button>
        </div>

        <table>
          <thead>
            <tr>
              <th style="width: 190px">订单号</th>
              <th style="width: 130px">用户</th>
              <th>商品</th>
              <th style="width: 120px">状态</th>
              <th style="width: 120px; text-align: right">金额</th>
              <th style="width: 150px">创建时间</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>

        <div class="pager">
          <span class="grow" id="total">共 186 条 · 每页 20 条</span>
          <button class="page">上一页</button>
          <button class="page on">1</button>
          <button class="page">2</button>
          <button class="page">3</button>
          <button class="page">…</button>
          <button class="page">10</button>
          <button class="page">下一页</button>
        </div>
      </div>

      <div class="note">
        <span class="dot"></span>
        示例数据，仅用于原型演示分页交互；正式版由真实 Spring Boot 实例返回
      </div>
    </div>

    <script>
      const q = new URLSearchParams(location.search)
      const port = q.get('port') || '18080'
      const branch = q.get('branch') || 'aide/order-api'
      const name = q.get('name') || '后端-订单'
      const project = q.get('project') || 'order-center'
      document.title = `AIDE 预览 · ${project} :${port}`
      document.getElementById('branchChip').textContent = branch
      document.getElementById('portChip').textContent = ':' + port
      document.getElementById('meta').textContent = `${name} · localhost:${port}`
      document.querySelector('.sub').textContent = `${project} · 由 ${name} 的 worktree 启动`

      const goods = ['机械键盘 K8', '人体工学椅', '27 寸 4K 显示器', 'USB-C 扩展坞', '降噪耳机', '升降桌 1.4m', '笔记本支架', '显示器挂灯']
      const users = ['lihao', 'wangq', 'zhaoy', 'chenm', 'sunl', 'huangf', 'zhouj', 'wux']
      const statuses = [
        ['paid', '已支付'],
        ['pending', '待支付'],
        ['refund', '退款中'],
        ['paid', '已支付'],
      ]
      const rows = document.getElementById('rows')
      let html = ''
      for (let i = 0; i < 8; i++) {
        const [cls, label] = statuses[i % statuses.length]
        const no = 'SO20261116' + String(1024 + i).padStart(4, '0')
        const amount = (199 + i * 137.5).toFixed(2)
        const hh = String(9 + (i % 9)).padStart(2, '0')
        html += `<tr>
          <td class="mono">${no}</td>
          <td>${users[i % users.length]}</td>
          <td>${goods[i % goods.length]}</td>
          <td><span class="tag ${cls}">${label}</span></td>
          <td class="amount">¥ ${amount}</td>
          <td class="mono">2026-11-16 ${hh}:${String((i * 7) % 60).padStart(2, '0')}</td>
        </tr>`
      }
      rows.innerHTML = html
    </script>
  </body>
</html>
